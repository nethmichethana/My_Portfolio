<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nethmi Chethana</title>

    <link rel="stylesheet" href="../assets/lib/normalize.css">

 <style>

     * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: 'Poppins', sans-serif;
     }

     body {
         background: linear-gradient(135deg, #1a0b3a, #3a1c71);
         color: #fff;
     }

     /* Nav Bar */
     .navbar {
         display: flex;
         justify-content: space-between;
         align-items: center;
         padding: 20px 50px;
     }


     .logo {
         font-size: 22px;
         font-weight: 600;
         letter-spacing: 2px;
     }


     .nav-links a {
         text-decoration: none;
         color: #ddd;
         padding: 8px 15px;
         border-radius: 20px;
         transition: 0.3s;
     }

     .nav-links a.active,
     .nav-links a:hover {
         background: #fff;
         color: #000;
     }

     .hire-btn {
         padding: 10px 20px;
         background: #fff;
         color: #000;
         border-radius: 25px;
         text-decoration: none;
         font-weight: 500;
     }
     .hero {
         display: flex;
         align-items: center;
         justify-content: space-between;
         padding: 60px 50px;
         min-height: 90vh;
     }

     .hero-text {
         max-width: 600px;
         animation: fadeIn 1.5s ease;
     }

     .badge {
         display: inline-block;
         padding: 8px 15px;
         background: rgba(255,255,255,0.1);
         border-radius: 20px;
         margin-bottom: 20px;
         font-size: 14px;
     }

     .hero h1 {
         font-size: 48px;
         margin-bottom: 15px;
     }

     .hero h1 span {
         font-weight: 300;
     }

     .role {
         font-size: 18px;
         margin-bottom: 20px;
         color: #ccc;
     }

     .desc {
         font-size: 15px;
         margin-bottom: 30px;
         color: #aaa;
     }
     .buttons {
         display: flex;
         gap: 15px;
     }

     .btn {
         padding: 12px 25px;
         border-radius: 25px;
         border: none;
         cursor: pointer;
         transition: 0.3s;
     }

     .btn-primary {
         background: #fff;
         color: #000;
     }

     .btn-secondary {
         background: rgba(255,255,255,0.1);
         color: #fff;
     }

     .btn:hover {
         transform: scale(1.05);
     }



 </style>

</head>

<body>

<!-- Nav Bar -->
<div class="navbar">
    <div class="logo">PORTFOLIO</div>

    <div class="nav-links">
        <a href="#" class="active">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">PORTFOLIO</a>
    </div>

    <a href="#" class="hire-btn">HIRE ME</a>
</div>


<!-- Hero section -->
<section class="hero">

    <div class="hero-text">
        <div class="badge">✨ Available For Opportunities</div>

        <h1>
            <span>Hey, I'm</span><br>
            Chethana Ekanayaka
        </h1>

        <div class="role">
            Software Developer / HR Assistant / Business Analyst
        </div>

        <div class="desc">
            Passionate Software Engineer focused on building clean, efficient, and user-friendly applications.
        </div>

        <div class="buttons">
            <button class="btn btn-primary">Let's Talk</button>
            <button class="btn btn-secondary">My Works</button>
        </div>
    </div>
</section>

</body>
</html>
