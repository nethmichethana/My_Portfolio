<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nethmi Chethana</title>

    <link rel="stylesheet" href="../assets/lib/normalize.css">

 <style>

     * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: 'Poppins', sans-serif;
     }

     body {
         background: linear-gradient(135deg, black, #3a1c71);
         color: #fff;
     }

     /* Nav Bar */

     .navbar {
         display: flex;
         justify-content: space-between;
         align-items: center;
         padding: 20px 50px;
     }


     .logo {
         font-size: 22px;
         font-weight: 600;
         letter-spacing: 2px;
     }
     /* hide checkbox */
     #menu-toggle {
         display: none;
     }

     /* hamburger icon */
     .menu-icon {
         display: none;
         font-size: 28px;
         cursor: pointer;
     }

     .nav-links {
         display: flex;
         gap: 20px;
     }


     .nav-links a {
         text-decoration: none;
         color: #ddd;
         padding: 8px 15px;
         border-radius: 20px;
         transition: 0.3s;
     }

     .nav-links a.active,
     .nav-links a:hover {
         background: #fff;
         color: #000;
     }

     .hire-btn {
         padding: 10px 20px;
         background: #fff;
         color: #000;
         border-radius: 25px;
         text-decoration: none;
         font-weight: 500;
     }
     .hero {
         display: flex;
         align-items: center;
         justify-content: space-between;
         padding: 60px 50px;
         min-height: 90vh;
     }

     .hero-text {
         max-width: 600px;
         animation: fadeIn 1.5s ease;
     }

     .badge {
         display: inline-block;
         padding: 8px 15px;
         background: rgba(255,255,255,0.1);
         border-radius: 20px;
         margin-bottom: 20px;
         font-size: 14px;
     }

     .hero h1 {
         font-size: 48px;
         margin-bottom: 15px;
         color: mediumslateblue;
     }

     .hero h1 span {
         font-weight: 300;
     }

     .role {
         font-size: 18px;
         margin-bottom: 20px;
         color: #ccc;
     }

     .desc {
         font-size: 15px;
         margin-bottom: 30px;
         color: #aaa;
     }
     .buttons {
         display: flex;
         gap: 15px;
     }

     .btn {
         padding: 12px 25px;
         border-radius: 25px;
         border: none;
         cursor: pointer;
         transition: 0.3s;
     }

     .btn-primary {
         background: #fff;
         color: #000;
     }

     .btn-secondary {
         background: rgba(255,255,255,0.1);
         color: #fff;
     }

     .btn:hover {
         transform: scale(1.05);
     }

     /* Image */
     .hero-img {
         position: relative;
         animation: float 3s ease-in-out infinite;


     }

     .hero-img img {
         width: 280px;
         border-radius: 50%;
         border: 5px solid rgba(255,255,255,0.2);
     }


     /* Animations */
     @keyframes fadeIn {
         from {opacity: 0; transform: translateY(20px);}
         to {opacity: 1; transform: translateY(0);}
     }
     @keyframes float {
         0% {
             transform: translateX(-100px) translateY(0);
         }
         50% {
             transform: translateX(-100px) translateY(-10px);
         }
         100% {
             transform: translateX(-100px) translateY(0);
         }
     }

     .nav-links {
         backdrop-filter: blur(10px);
     }

     /* Tablet mode*/
     @media (max-width: 992px) {

         .hero {
             flex-direction: column;
             align-items: center;
             text-align: center;
         }

         .hero-text {
             display: flex;
             flex-direction: column;
             align-items: center;
         }

         .buttons {
             justify-content: center; /* buttons center */
         }

         .hero-img {

             margin-top: 30px;
             display: flex;
             justify-content: center;
         }

         .hero-img img {
             margin-left: 90px;
             display: block;
             /*margin: auto;*/
         }

     }

     /* MobileMode mode*/

     @media (max-width: 768px) {

         .menu-icon {
             display: block;
             margin-left: auto;
         }

         .nav-links {
             position: fixed;
             top: 0;
             left: -100%;
             width: 220px;
             height: 100vh;
             background: #1a0b3a;
             flex-direction: column;
             padding: 60px 20px;
             transition: 0.3s;
         }

         .nav-links a {
             display: block;
             margin: 15px 0;
         }

         /* 🔥 KEY LINE */
         #menu-toggle:checked ~ .nav-links {
             left: 0;
         }

         .hire-btn {
             display: none;
         }

         .hero {
             flex-direction: column;
             text-align: center;
             padding: 40px 20px;
         }

         .hero h1 {
             font-size: 32px;
         }
     }




 </style>

</head>

<body>

<!-- Nav Bar -->
<div class="navbar">
    <div class="logo">PORTFOLIO</div>

    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="menu-icon">
        ☰
    </label>

    <div class="nav-links">
        <a href="#" class="active">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">PORTFOLIO</a>
    </div>

    <a href="#" class="hire-btn">HIRE ME</a>
</div>


<!-- Hero section -->
<section class="hero">

    <div class="hero-text">
        <div class="badge">✨ Available For Opportunities</div>

        <h1>
            <span>Hey, I'm</span><br>
            Chethana Ekanayaka
        </h1>

        <div class="role">
            Software Developer / HR Assistant / Business Analyst
        </div>

        <div class="desc">
            Passionate Software Engineer focused on building clean, efficient, and user-friendly applications.
        </div>

        <div class="buttons">
            <button class="btn btn-primary">Let's Talk</button>
            <button class="btn btn-secondary">My Works</button>
        </div>
    </div>
    <div class="hero-img">
        <img src="assets/myphoto1.jpeg" alt="profile" />
    </div>
</section>

<section id="about" class="about-section">

    <div class="about-container">

        <!-- LEFT IMAGE -->
        <div class="about-img">
            <img src="assets/myphoto2.jpeg" alt="about image">
        </div>
    </div>
</section>

</body>
</html>
